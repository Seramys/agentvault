<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Environment migration decision flow</title>
  <desc id="desc">agentvault classifies env entries into migrated secrets, kept references, and unchanged plain settings. Dry-run shows every bucket, and flags override the heuristic.</desc>
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F6FF"/><stop offset="1" stop-color="#F3F1FF"/>
    </linearGradient>
    <linearGradient id="mig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0E7FF"/><stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="keep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FEF3C7"/><stop offset="1" stop-color="#FFFBEB"/>
    </linearGradient>
    <linearGradient id="stay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D1FAE5"/><stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
    <filter id="sh6" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#5B5BD6" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#8A93B8"/>
    </marker>
    <style>
      .t { font: 700 30px Inter, "Segoe UI", sans-serif; fill: #25264A; }
      .s { font: 400 15px Inter, "Segoe UI", sans-serif; fill: #69718F; }
      .h { font: 700 16px Inter, "Segoe UI", sans-serif; fill: #25264A; }
      .b { font: 400 13px Inter, "Segoe UI", sans-serif; fill: #4B5373; }
      .m { font: 500 12.5px "JetBrains Mono", Consolas, monospace; fill: #4B5373; }
      .tag { font: 700 11px Inter, "Segoe UI", sans-serif; fill: #FFFFFF; letter-spacing: .08em; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="28" fill="url(#bg6)"/>
  <text x="48" y="62" class="t">Env migration: a visible, overridable heuristic</text>
  <text x="48" y="90" class="s">Static client paths are not guessed. Secret-looking env is a heuristic — so every decision is printed before a write.</text>

  <!-- input config -->
  <g filter="url(#sh6)">
    <rect x="40" y="132" width="318" height="438" rx="20" fill="#FFFFFF" stroke="#DCD8F4"/>
    <text x="64" y="170" class="h">Input config</text>
    <text x="64" y="192" class="b">server "postgres" · env</text>
    <rect x="60" y="212" width="278" height="312" rx="14" fill="#FBFBFE" stroke="#E4E0FA"/>
    <text x="78" y="244" class="m">DATABASE_URL</text>
    <text x="78" y="266" class="m" fill="#8A93B8">postgres://demo:***@localhost</text>
    <text x="78" y="306" class="m">API_KEY</text>
    <text x="78" y="328" class="m" fill="#8A93B8">sk-test-demo-123</text>
    <text x="78" y="368" class="m">PASS_THROUGH</text>
    <text x="78" y="390" class="m" fill="#8A93B8">${HOME}/.config</text>
    <text x="78" y="430" class="m">LOG_LEVEL</text>
    <text x="78" y="452" class="m" fill="#8A93B8">info</text>
    <text x="78" y="492" class="m">MAX_TOKENS</text>
    <text x="78" y="514" class="m" fill="#8A93B8">4096</text>
  </g>

  <line x1="358" y1="350" x2="404" y2="350" stroke="#8A93B8" stroke-width="2" marker-end="url(#arrow6)"/>

  <!-- classifier -->
  <g filter="url(#sh6)">
    <rect x="412" y="220" width="286" height="260" rx="20" fill="#FFFFFF" stroke="#C7C2EE"/>
    <circle cx="452" cy="258" r="16" fill="#8B9CFF"/>
    <text x="447" y="264" class="tag">?</text>
    <text x="480" y="264" class="h">classify</text>
    <text x="440" y="300" class="b">1. reference guard first</text>
    <text x="440" y="324" class="b">${VAR}, $VAR, %VAR%, {{VAR}}</text>
    <text x="440" y="356" class="b">2. secret key markers</text>
    <text x="440" y="380" class="b">TOKEN · SECRET · PASS · URL · KEY</text>
    <text x="440" y="412" class="b">3. secret value shapes</text>
    <text x="440" y="436" class="b">sk- · ghp_ · JWT · PEM · DSN</text>
    <text x="440" y="466" class="m" fill="#6D5BD0">never migrates an embedded reference</text>
  </g>

  <line x1="698" y1="286" x2="744" y2="238" stroke="#8A93B8" stroke-width="2" marker-end="url(#arrow6)"/>
  <line x1="698" y1="350" x2="744" y2="350" stroke="#8A93B8" stroke-width="2" marker-end="url(#arrow6)"/>
  <line x1="698" y1="414" x2="744" y2="466" stroke="#8A93B8" stroke-width="2" marker-end="url(#arrow6)"/>

  <!-- migrate -->
  <g filter="url(#sh6)">
    <rect x="752" y="132" width="408" height="160" rx="18" fill="url(#mig)" stroke="#C7D2FE"/>
    <rect x="752" y="132" width="124" height="34" rx="17" fill="#6D5BD0"/>
    <text x="776" y="154" class="tag">MIGRATE</text>
    <text x="776" y="196" class="m">DATABASE_URL · API_KEY</text>
    <text x="776" y="224" class="b">Value moves to the OS keystore; the env entry is</text>
    <text x="776" y="244" class="b">removed and passed by `run --env KEY=secret:NAME`.</text>
    <text x="776" y="274" class="m" fill="#6D5BD0">config no longer contains the plaintext</text>
  </g>

  <!-- keep -->
  <g filter="url(#sh6)">
    <rect x="752" y="312" width="408" height="126" rx="18" fill="url(#keep)" stroke="#FDE68A"/>
    <rect x="752" y="312" width="92" height="34" rx="17" fill="#B45309"/>
    <text x="776" y="334" class="tag">KEEP</text>
    <text x="776" y="376" class="m">PASS_THROUGH</text>
    <text x="776" y="402" class="b">${HOME}/.config stays a reference; the MCP client</text>
    <text x="776" y="422" class="b">expands it at spawn time.</text>
  </g>

  <!-- unchanged -->
  <g filter="url(#sh6)">
    <rect x="752" y="458" width="408" height="112" rx="18" fill="url(#stay)" stroke="#A7F3D0"/>
    <rect x="752" y="458" width="118" height="34" rx="17" fill="#047857"/>
    <text x="776" y="480" class="tag">UNCHANGED</text>
    <text x="776" y="522" class="m">LOG_LEVEL · MAX_TOKENS</text>
    <text x="776" y="548" class="b">Not secret-looking: left in the config verbatim.</text>
  </g>

  <!-- footer -->
  <g filter="url(#sh6)">
    <rect x="40" y="600" width="1120" height="82" rx="18" fill="#FFFFFF" stroke="#DCD8F4"/>
    <text x="64" y="632" class="m" fill="#6D5BD0">agentvault init --path mcp.json --dry-run</text>
    <text x="64" y="658" class="b">Prints migrate / keep / unchanged / skip. Force a call with --migrate-env KEY or --keep-env KEY. Real writes are backed up.</text>
  </g>
</svg>