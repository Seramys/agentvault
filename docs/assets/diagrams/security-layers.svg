<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">AgentVault security layers</title>
  <desc id="desc">Layers 0, 1 and 4 are implemented. Layers 2 and 3 are explicit follow-ups.</desc>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F6FF"/>
      <stop offset="1" stop-color="#F3F1FF"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="p4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="s4" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#5B5BD6" flood-opacity="0.09"/>
    </filter>
    <style>
      .t { font: 700 30px Inter, "Segoe UI", sans-serif; fill: #25264A; }
      .s { font: 400 15px Inter, "Segoe UI", sans-serif; fill: #69718F; }
      .h { font: 700 17px Inter, "Segoe UI", sans-serif; fill: #25264A; }
      .b { font: 400 14px Inter, "Segoe UI", sans-serif; fill: #4B5373; }
      .m { font: 500 13px "JetBrains Mono", Consolas, monospace; fill: #4B5373; }
      .n { font: 700 15px Inter, "Segoe UI", sans-serif; fill: #FFFFFF; }
      .tag { font: 600 12px Inter, "Segoe UI", sans-serif; fill: #3E4770; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#bg4)"/>
  <text x="48" y="62" class="t">Security model, in plain terms</text>
  <text x="48" y="90" class="s">The CLI is a credential lifecycle layer, not a sandbox. The boundary is stated explicitly.</text>

  <!-- layer rows -->
  <g filter="url(#s4)">
    <rect x="40" y="128" width="790" height="76" rx="16" fill="#FFFFFF" stroke="#DCD8F4"/>
    <circle cx="76" cy="166" r="19" fill="url(#g4)"/><text x="70" y="171" class="n">0</text>
    <text x="110" y="160" class="h">OS keystore + device binding</text>
    <text x="110" y="184" class="b">DPAPI / Keychain / Secret Service; hostname + user + hardware fingerprint.</text>
    <rect x="730" y="148" width="78" height="28" rx="14" fill="#DCFCE7"/><text x="750" y="167" class="tag">done</text>
  </g>

  <g filter="url(#s4)">
    <rect x="40" y="216" width="790" height="76" rx="16" fill="#FFFFFF" stroke="#DCD8F4"/>
    <circle cx="76" cy="254" r="19" fill="url(#g4)"/><text x="70" y="259" class="n">1</text>
    <text x="110" y="248" class="h">Short tickets + local broker</text>
    <text x="110" y="272" class="b">One-use by default; TTL, scope, child tickets, renew, rotate, revoke.</text>
    <rect x="730" y="236" width="78" height="28" rx="14" fill="#DCFCE7"/><text x="750" y="255" class="tag">done</text>
  </g>

  <g opacity="0.82">
    <rect x="40" y="304" width="790" height="76" rx="16" fill="#FFFFFF" stroke="#DCD8F4" stroke-dasharray="7 6"/>
    <circle cx="76" cy="342" r="19" fill="#E5E7EB" stroke="#9CA3AF" stroke-dasharray="4 4"/><text x="70" y="347" class="n" fill="#6B7280">2</text>
    <text x="110" y="336" class="h">Sandbox / microVM</text>
    <text x="110" y="360" class="b">Isolate the agent process from files, network and other user data.</text>
    <rect x="730" y="324" width="78" height="28" rx="14" fill="#F3F4F6"/><text x="746" y="343" class="tag">later</text>
  </g>

  <g opacity="0.82">
    <rect x="40" y="392" width="790" height="76" rx="16" fill="#FFFFFF" stroke="#DCD8F4" stroke-dasharray="7 6"/>
    <circle cx="76" cy="430" r="19" fill="#E5E7EB" stroke="#9CA3AF" stroke-dasharray="4 4"/><text x="70" y="435" class="n" fill="#6B7280">3</text>
    <text x="110" y="424" class="h">Egress control / DLP</text>
    <text x="110" y="448" class="b">Stop secrets or sensitive context from leaving the machine.</text>
    <rect x="730" y="412" width="78" height="28" rx="14" fill="#F3F4F6"/><text x="746" y="431" class="tag">later</text>
  </g>

  <g filter="url(#s4)">
    <rect x="40" y="480" width="790" height="76" rx="16" fill="#FFFFFF" stroke="#DCD8F4"/>
    <circle cx="76" cy="518" r="19" fill="url(#p4)"/><text x="70" y="523" class="n">4</text>
    <text x="110" y="512" class="h">Audit trail + honeypot canaries</text>
    <text x="110" y="536" class="b">Append-only JSONL; canary use triggers global revocation.</text>
    <rect x="730" y="500" width="78" height="28" rx="14" fill="#EDE9FE"/><text x="750" y="519" class="tag">done</text>
  </g>

  <!-- right panel -->
  <g filter="url(#s4)">
    <rect x="862" y="128" width="298" height="428" rx="20" fill="#FFFFFF" stroke="#DCD8F4"/>
    <text x="888" y="166" class="h">What this version protects</text>
    <text x="888" y="196" class="b">✓ accidental plaintext in configs</text>
    <text x="888" y="220" class="b">✓ long-lived tokens in agent prompts</text>
    <text x="888" y="244" class="b">✓ replay after one use</text>
    <text x="888" y="268" class="b">✓ forgotten tickets that never expire</text>
    <text x="888" y="292" class="b">✓ secrets that cannot be revoked</text>
    <text x="888" y="316" class="b">✓ silent config rewrites</text>

    <line x1="888" y1="338" x2="1134" y2="338" stroke="#E4E0FA"/>
    <text x="888" y="368" class="h">What it does not protect</text>
    <text x="888" y="396" class="b">✗ a malicious process running as you</text>
    <text x="888" y="420" class="b">✗ an agent reading unmigrated plaintext</text>
    <text x="888" y="444" class="b">✗ network exfiltration</text>
    <text x="888" y="468" class="b">✗ TPM-backed isolation</text>
    <text x="888" y="492" class="b">✗ multi-user tenancy</text>
    <text x="888" y="516" class="b">Layers 2 and 3 are the follow-up.</text>
  </g>

  <rect x="40" y="580" width="1120" height="28" rx="14" fill="#FFFFFF" opacity="0.75" stroke="#E4E0FA"/>
  <text x="60" y="599" class="m">same-user boundary: any process that can read your user files can also read the local admin token</text>
</svg>