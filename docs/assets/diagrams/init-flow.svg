<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">init migration flow</title>
  <desc id="desc">agentvault init discovers a config, shows a dry run, backs up the file, migrates only planned secrets, wraps the command, and verifies idempotence.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F6FF"/>
      <stop offset="1" stop-color="#F3F1FF"/>
    </linearGradient>
    <filter id="s3" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#5B5BD6" flood-opacity="0.09"/>
    </filter>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#8A93B8"/>
    </marker>
    <style>
      .t { font: 700 30px Inter, "Segoe UI", sans-serif; fill: #25264A; }
      .s { font: 400 15px Inter, "Segoe UI", sans-serif; fill: #69718F; }
      .h { font: 700 15px Inter, "Segoe UI", sans-serif; fill: #25264A; }
      .b { font: 400 13px Inter, "Segoe UI", sans-serif; fill: #4B5373; }
      .m { font: 500 12px "JetBrains Mono", Consolas, monospace; fill: #4B5373; }
      .n { font: 700 13px Inter, "Segoe UI", sans-serif; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#bg3)"/>
  <text x="48" y="62" class="t">What `agentvault init` does</text>
  <text x="48" y="90" class="s">One command. No blind rewrite. Every mutation is visible and reversible.</text>

  <!-- 6 steps -->
  <g filter="url(#s3)">
    <rect x="40" y="140" width="170" height="240" rx="18" fill="#FFFFFF" stroke="#DCD8F4"/>
    <circle cx="72" cy="172" r="14" fill="#8B9CFF"/><text x="67" y="177" class="n">1</text>
    <text x="96" y="178" class="h">discover</text>
    <text x="60" y="212" class="b">known client</text>
    <text x="60" y="232" class="b">registry</text>
    <text x="60" y="252" class="b">project-first</text>
    <text x="60" y="272" class="b">counts wrapped</text>
    <text x="60" y="292" class="b">auto pick</text>
    <rect x="60" y="318" width="130" height="42" rx="10" fill="#F5F3FF"/>
    <text x="70" y="336" class="m">init --list</text>
    <text x="70" y="352" class="m">--agent/--path</text>
  </g>

  <line x1="210" y1="260" x2="236" y2="260" stroke="#8A93B8" stroke-width="2" marker-end="url(#a3)"/>

  <g filter="url(#s3)">
    <rect x="244" y="140" width="170" height="240" rx="18" fill="#FFFFFF" stroke="#DCD8F4"/>
    <circle cx="276" cy="172" r="14" fill="#A78BFA"/><text x="271" y="177" class="n">2</text>
    <text x="300" y="178" class="h">dry run</text>
    <text x="264" y="212" class="b">no file written</text>
    <text x="264" y="232" class="b">no secret added</text>
    <text x="264" y="252" class="b">no backup</text>
    <text x="264" y="272" class="b">show all actions</text>
    <text x="264" y="292" class="b">migrate / keep</text>
    <text x="264" y="312" class="b">unchanged / skip</text>
    <rect x="264" y="328" width="130" height="30" rx="10" fill="#F5F3FF"/>
    <text x="274" y="348" class="m">--dry-run</text>
  </g>

  <line x1="414" y1="260" x2="440" y2="260" stroke="#8A93B8" stroke-width="2" marker-end="url(#a3)"/>

  <g filter="url(#s3)">
    <rect x="448" y="140" width="170" height="240" rx="18" fill="#FFFFFF" stroke="#DCD8F4"/>
    <circle cx="480" cy="172" r="14" fill="#6EE7B7"/><text x="475" y="177" class="n">3</text>
    <text x="504" y="178" class="h">backup</text>
    <text x="468" y="212" class="b">copy before write</text>
    <text x="468" y="232" class="b">timestamped .bak</text>
    <text x="468" y="252" class="b">restore on failed</text>
    <text x="468" y="272" class="b">verification</text>
    <text x="468" y="292" class="b">atomic write</text>
    <rect x="468" y="318" width="130" height="42" rx="10" fill="#ECFDF5"/>
    <text x="478" y="336" class="m">mcp.json.bak</text>
    <text x="478" y="352" class="m">.timestamp</text>
  </g>

  <line x1="618" y1="260" x2="644" y2="260" stroke="#8A93B8" stroke-width="2" marker-end="url(#a3)"/>

  <g filter="url(#s3)">
    <rect x="652" y="140" width="170" height="240" rx="18" fill="#FFFFFF" stroke="#DCD8F4"/>
    <circle cx="684" cy="172" r="14" fill="#FBBF24"/><text x="679" y="177" class="n">4</text>
    <text x="708" y="178" class="h">migrate</text>
    <text x="672" y="212" class="b">only planned</text>
    <text x="672" y="232" class="b">servers</text>
    <text x="672" y="252" class="b">key + value</text>
    <text x="672" y="272" class="b">heuristics</text>
    <text x="672" y="292" class="b">reject ${...}</text>
    <rect x="672" y="318" width="130" height="42" rx="10" fill="#FFFBEB"/>
    <text x="682" y="336" class="m">secret_add</text>
    <text x="682" y="352" class="m">name/value</text>
  </g>

  <line x1="822" y1="260" x2="848" y2="260" stroke="#8A93B8" stroke-width="2" marker-end="url(#a3)"/>

  <g filter="url(#s3)">
    <rect x="856" y="140" width="170" height="240" rx="18" fill="#FFFFFF" stroke="#DCD8F4"/>
    <circle cx="888" cy="172" r="14" fill="#F3C4E3"/><text x="883" y="177" class="n">5</text>
    <text x="912" y="178" class="h">wrap</text>
    <text x="876" y="212" class="b">absolute launcher</text>
    <text x="876" y="232" class="b">explicit home</text>
    <text x="876" y="252" class="b">env → secret:NAME</text>
    <text x="876" y="272" class="b">unknown fields kept</text>
    <text x="876" y="292" class="b">multi-line args kept</text>
    <rect x="876" y="318" width="130" height="42" rx="10" fill="#FDF2F8"/>
    <text x="886" y="336" class="m">agentvault run</text>
    <text x="886" y="352" class="m">--env KEY=…</text>
  </g>

  <line x1="1026" y1="260" x2="1052" y2="260" stroke="#8A93B8" stroke-width="2" marker-end="url(#a3)"/>

  <g filter="url(#s3)">
    <rect x="1060" y="140" width="100" height="240" rx="18" fill="#FFFFFF" stroke="#DCD8F4"/>
    <circle cx="1092" cy="172" r="14" fill="#8B9CFF"/><text x="1087" y="177" class="n">6</text>
    <text x="1082" y="208" class="h">verify</text>
    <text x="1080" y="238" class="b">reload</text>
    <text x="1080" y="258" class="b">check</text>
    <text x="1080" y="278" class="b">idempotent</text>
    <text x="1080" y="298" class="b">second run</text>
    <text x="1080" y="318" class="b">no-op</text>
  </g>

  <!-- result strip -->
  <g>
    <rect x="40" y="414" width="1120" height="102" rx="18" fill="#FFFFFF" stroke="#E4E0FA"/>
    <text x="62" y="444" class="h">Safety rules</text>
    <circle cx="70" cy="470" r="4" fill="#6EE7B7"/><text x="84" y="475" class="b">Only planned servers are touched; URL-only / wrapped stay unchanged.</text>
    <circle cx="70" cy="492" r="4" fill="#6EE7B7"/><text x="84" y="497" class="b">References never migrate; use --migrate-env / --keep-env to override.</text>
    <circle cx="620" cy="470" r="4" fill="#A78BFA"/><text x="634" y="475" class="b">Refresh updates launcher/home without re-migrating env.</text>
    <circle cx="620" cy="492" r="4" fill="#A78BFA"/><text x="634" y="497" class="b">JSONC rejected; UTF-8 BOM accepted.</text>
  </g>
</svg>