<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Ticket replay denied</title>
  <desc id="desc">A first resolve returns the secret, the second resolve is denied because the ticket is one-use.</desc>
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F6FF"/><stop offset="1" stop-color="#F1EEFF"/>
    </linearGradient>
    <filter id="ts" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5B5BD6" flood-opacity="0.12"/>
    </filter>
    <style>
      .win { fill: #FFFFFF; stroke: #DCD8F4; }
      .bar { fill: #F5F3FF; }
      .mono { font: 500 15px "JetBrains Mono", Consolas, monospace; fill: #4B5373; }
      .dim { font: 500 15px "JetBrains Mono", Consolas, monospace; fill: #8A93B8; }
      .ok { font: 600 15px "JetBrains Mono", Consolas, monospace; fill: #0F9F6E; }
      .bad { font: 600 15px "JetBrains Mono", Consolas, monospace; fill: #D9455F; }
      .title { font: 600 13px Inter, "Segoe UI", sans-serif; fill: #69718F; }
    </style>
  </defs>
  <rect width="1000" height="450" rx="28" fill="url(#tbg)"/>
  <g filter="url(#ts)">
    <rect x="50" y="40" width="900" height="370" rx="18" class="win"/>
    <rect x="50" y="40" width="900" height="44" rx="18" class="bar"/>
    <rect x="50" y="66" width="900" height="18" fill="#F5F3FF"/>
    <circle cx="78" cy="62" r="6" fill="#FCA5A5"/>
    <circle cx="100" cy="62" r="6" fill="#FCD34D"/>
    <circle cx="122" cy="62" r="6" fill="#6EE7B7"/>
    <text x="500" y="67" text-anchor="middle" class="title">agentvault · replay is denied</text>
    <line x1="50" y1="84" x2="950" y2="84" stroke="#E4E0FA"/>
  </g>
  <text x="78" y="124" class="mono"><tspan class="dim">$</tspan> agentvault issue --secret db/prod --ttl 30s</text>
  <text x="78" y="154" class="mono">av1.eyJzdWIiOiJkYi9wcm9kIi...</text>
  <text x="78" y="184" class="dim">kind=leaf jti=0f2c… expires_in=30s uses=1</text>
  <text x="78" y="228" class="mono"><tspan class="dim">$</tspan> agentvault resolve --ticket av1…</text>
  <text x="78" y="258" class="ok">postgres://app:***@127.0.0.1:5432/prod</text>
  <text x="78" y="302" class="mono"><tspan class="dim">$</tspan> agentvault resolve --ticket av1…</text>
  <text x="78" y="332" class="bad">error: denied: ticket revoked</text>
  <text x="78" y="370" class="dim">audit: ticket.resolve  result=revoked</text>
  <text x="78" y="394" class="dim">the secret never had to be copied into the agent config</text>
</svg>