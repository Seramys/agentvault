<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Honeypot canary trips global revocation</title>
  <desc id="desc">Checking a canary token reports hit true and revokes all tickets.</desc>
  <defs>
    <linearGradient id="tbg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F6FF"/><stop offset="1" stop-color="#FDF2F8"/>
    </linearGradient>
    <filter id="ts2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5B5BD6" flood-opacity="0.12"/>
    </filter>
    <style>
      .win { fill: #FFFFFF; stroke: #DCD8F4; }
      .bar { fill: #F5F3FF; }
      .mono { font: 500 15px "JetBrains Mono", Consolas, monospace; fill: #4B5373; }
      .dim { font: 500 15px "JetBrains Mono", Consolas, monospace; fill: #8A93B8; }
      .ok { font: 600 15px "JetBrains Mono", Consolas, monospace; fill: #0F9F6E; }
      .bad { font: 600 15px "JetBrains Mono", Consolas, monospace; fill: #D9455F; }
      .title { font: 600 13px Inter, "Segoe UI", sans-serif; fill: #69718F; }
    </style>
  </defs>
  <rect width="1000" height="450" rx="28" fill="url(#tbg2)"/>
  <g filter="url(#ts2)">
    <rect x="50" y="40" width="900" height="370" rx="18" class="win"/>
    <rect x="50" y="40" width="900" height="44" rx="18" class="bar"/>
    <rect x="50" y="66" width="900" height="18" fill="#F5F3FF"/>
    <circle cx="78" cy="62" r="6" fill="#FCA5A5"/>
    <circle cx="100" cy="62" r="6" fill="#FCD34D"/>
    <circle cx="122" cy="62" r="6" fill="#6EE7B7"/>
    <text x="500" y="67" text-anchor="middle" class="title">agentvault · honeypot canary</text>
    <line x1="50" y1="84" x2="950" y2="84" stroke="#E4E0FA"/>
  </g>
  <text x="78" y="124" class="mono"><tspan class="dim">$</tspan> agentvault honeypot add prod/canary --json</text>
  <text x="78" y="154" class="mono">{"honeypot":"prod/canary","token":"canary_7f9a…"}</text>
  <text x="78" y="198" class="mono"><tspan class="dim">$</tspan> agentvault honeypot check canary_7f9a…</text>
  <text x="78" y="228" class="bad">hit=true honeypot=prod/canary revoked_all=true</text>
  <text x="78" y="272" class="mono"><tspan class="dim">$</tspan> agentvault resolve --ticket av1…</text>
  <text x="78" y="302" class="bad" style="font-size:13px">error: denied: ticket was invalidated by a global revocation</text>
  <text x="78" y="340" class="dim">the audit trail records actor, secret, ticket, result and timestamp</text>
  <text x="78" y="364" class="dim">revoke --all bumps the global epoch; every old ticket dies at once</text>
</svg>