<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Refresh wrapped launcher</title>
  <desc id="desc">init --refresh dry-run repoints already wrapped Codex servers from the debug binary to the release binary without changing env.</desc>
  <defs>
    <linearGradient id="tbg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F6FF"/><stop offset="1" stop-color="#F1EEFF"/>
    </linearGradient>
    <filter id="ts3" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5B5BD6" flood-opacity="0.12"/>
    </filter>
    <style>
      .win { fill: #FFFFFF; stroke: #DCD8F4; }
      .bar { fill: #F5F3FF; }
      .mono { font: 500 14px "JetBrains Mono", Consolas, monospace; fill: #4B5373; }
      .dim { font: 500 14px "JetBrains Mono", Consolas, monospace; fill: #8A93B8; }
      .ok { font: 600 14px "JetBrains Mono", Consolas, monospace; fill: #0F9F6E; }
      .violet { font: 600 14px "JetBrains Mono", Consolas, monospace; fill: #6D5BD0; }
      .title { font: 600 13px Inter, "Segoe UI", sans-serif; fill: #69718F; }
    </style>
  </defs>
  <rect width="1000" height="450" rx="28" fill="url(#tbg3)"/>
  <g filter="url(#ts3)">
    <rect x="50" y="40" width="900" height="370" rx="18" class="win"/>
    <rect x="50" y="40" width="900" height="44" rx="18" class="bar"/>
    <rect x="50" y="66" width="900" height="18" fill="#F5F3FF"/>
    <circle cx="78" cy="62" r="6" fill="#FCA5A5"/>
    <circle cx="100" cy="62" r="6" fill="#FCD34D"/>
    <circle cx="122" cy="62" r="6" fill="#6EE7B7"/>
    <text x="500" y="67" text-anchor="middle" class="title">agentvault · refresh launcher</text>
    <line x1="50" y1="84" x2="950" y2="84" stroke="#E4E0FA"/>
  </g>
  <text x="78" y="124" class="mono"><tspan class="dim">$</tspan> agentvault init --agent codex --refresh --dry-run</text>
  <text x="78" y="154" class="violet">would refresh 2 wrapped server(s):</text>
  <text x="78" y="182" class="mono">- node_repl: …\target\debug\agentvault.exe … -> refreshed</text>
  <text x="78" y="206" class="dim">  unchanged env: BROWSER_USE_*, CODEX_HOME, NODE_REPL_*</text>
  <text x="78" y="234" class="mono">- cua_repl: …\target\debug\agentvault.exe … -> refreshed</text>
  <text x="78" y="274" class="ok">dry run: no files were changed</text>
  <text x="78" y="308" class="mono"><tspan class="dim">$</tspan> agentvault init --agent codex --refresh</text>
  <text x="78" y="338" class="ok">wrote: D:\Codex\config.toml</text>
  <text x="78" y="362" class="dim">backup: D:\Codex\config.toml.bak.1795259906317</text>
  <text x="78" y="390" class="dim">release launcher + explicit home; env, plugins and projects untouched</text>
</svg>