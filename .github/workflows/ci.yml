name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Build web console
        working-directory: webapp
        run: npm ci && npm run build

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test (full, Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace

      - name: Test (library, Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          cargo test --workspace --lib 2>&1 | tee unix-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Unix library test failure'
              echo '```text'
              tail -n 120 unix-tests.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
