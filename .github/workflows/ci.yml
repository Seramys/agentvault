name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Build web console
        working-directory: webapp
        run: npm ci && npm run build

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test (full, Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace

      - name: Test (library, Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          cargo test --workspace --lib 2>&1 | tee unix-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Unix library test failure'
              echo '```text'
              tail -n 120 unix-tests.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Publish Unix test log
        if: failure() && runner.os == 'Linux'
        run: |
          if [ -f unix-tests.log ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout --orphan "ci-debug-${GITHUB_RUN_ID}"
            git rm -rf . >/dev/null 2>&1 || true
            cp unix-tests.log debug.log
            git add debug.log
            git commit -m "ci debug log ${GITHUB_RUN_ID}"
            git push origin "HEAD:ci-debug-${GITHUB_RUN_ID}"
          fi

