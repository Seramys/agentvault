# Codex 0.50-era config: remote (rmcp) servers plus inline env tables.
experimental_use_rmcp_client = true
model = "gpt-5"

[mcp_servers.remote]
url = "https://mcp.example.com/sse"
bearer_token_env_var = "REMOTE_MCP_TOKEN"
startup_timeout_sec = 30

[mcp_servers.remote.http_headers]
X-Client = "codex"

[mcp_servers.local]
command = "uvx"
args = ["mcp-server-fetch"]
env = { FETCH_API_KEY = "sk-corpus-fetch-key", LOG_LEVEL = "warn" }